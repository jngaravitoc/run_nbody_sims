; pynbody reads ./config.ini from the working directory at import time.
; Its default Gadget-HDF mapping puts PartType2/3 (InkWell: stellar disk, bulge) into "dm".
; For these runs: 0 = gas, 1 = DM halo, 2 = stellar disk, 3 = bulge, 4 = new stars (unused).
[gadgethdf-type-mapping]
gas: PartType0
dm: PartType1
star: PartType2, PartType3, PartType4
bh: PartType5
